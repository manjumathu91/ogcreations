<div class="field {% if field.errors %}has-error{% endif %}">
  {% if field.widget_type == "checkbox" %}
    <label class="check-row">{{ field }}<span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<em class="req">*</em>{% endif %}</label>
    {% if field.field.widget.attrs.accept and field.value and field.value.url %}<div class="current-img"><img src="{{ field.value.url }}" alt=""></div>{% endif %}
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error">{{ e }}</p>{% endfor %}
</div>
